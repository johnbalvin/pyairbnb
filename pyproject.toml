[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]

version = '2.2.9'
name="pyairbnb"
description = 'Airbnb scraper in Python'
authors = [
  { name="John Balvin", email="johnchristian@hotmail.es" },
]
readme= "README.md"
keywords=['airbnb', 'scraper', 'crawler','bot','reviews']
dependencies=['curl_cffi','bs4','requests']
requires-python = ">=3.10"


[project.urls]
Homepage='https://github.com/johnbalvin/pyairbnb'


[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools.package-data]
pyairbnb = ["py.typed"]
